<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAP The Series | Episodes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f1a;color:white}
header{background:linear-gradient(135deg,#ff4da6,#7b2ff7);padding:50px 20px;text-align:center}
header h1{font-size:2.5rem}
section{padding:60px 10%}
h2{margin-bottom:30px;color:#ff4da6;text-align:center}
.trailer iframe{width:100%;height:400px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.card{
background:#1c1c2e;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transition:0.3s;
text-align:center;
}
.card:hover{transform:translateY(-8px)}
button{
padding:10px 20px;
border:none;
border-radius:30px;
background:#ff4da6;
color:white;
cursor:pointer;
font-weight:600;
margin-top:10px;
}
a{text-decoration:none;color:white}
footer{
background:#141428;
text-align:center;
padding:20px;
margin-top:40px;
}
@media(max-width:600px){
.trailer iframe{height:250px}
}
</style>
</head>
<body>

<header>
<h1>GAP The Series (2022)</h1>
<p>Romantic • Drama • GL</p>
</header>

<!-- TRAILER SECTION -->
<section>
<h2>Official Trailer</h2>
<div class="trailer">
<iframe src="https://www.youtube.com/embed/f7Kso0QOaiE" 
title="GAP Trailer" 
frameborder="0" 
allowfullscreen>
</iframe>
</div>
</section>

<!-- EPISODES SECTION -->
<section>
<h2>Episodes</h2>
<div class="grid">

<div class="card">
<h3>Episode 1</h3>
<p>The Beginning of Their Story</p>
<button onclick="window.open('https://youtu.be/EP1_LINK')">Watch</button>
</div>

<div class="card">
<h3>Episode 2</h3>
<p>Unexpected Feelings</p>
<button onclick="window.open('https://youtu.be/EP2_LINK')">Watch</button>
</div>

<div class="card">
<h3>Episode 3</h3>
<p>Closer Than Before</p>
<button onclick="window.open('https://youtu.be/EP3_LINK')">Watch</button>
</div>

<div class="card">
<h3>Episode 4</h3>
<p>Misunderstandings</p>
<button onclick="window.open('https://youtu.be/EP4_LINK')">Watch</button>
</div>

<!-- Continue until Episode 12 -->

</div>
</section>

<footer>
<p>© 2026 FreenBecky Universe</p>
</footer>

</body>
</html>
